# kind cluster config: expose the API on 0.0.0.0 so CI runners inside
# Docker (act) can reach it via host.docker.internal. Default kind binds
# the API to 127.0.0.1, which is unreachable from inside sibling containers.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: 0.0.0.0
  apiServerPort: 6443
nodes:
  - role: control-plane
